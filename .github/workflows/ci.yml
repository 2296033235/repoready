name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show CLI entry point works
        run: python -m repoready --version
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  windows-local:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise the local backend on Windows
        run: python -m unittest tests.test_local_backend -v

  docker-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run a repository through a live container
        shell: bash
        run: |
          fixture="$(mktemp -d)"
          git -C "$fixture" init --quiet
          git -C "$fixture" config user.email "ci@example.com"
          git -C "$fixture" config user.name "RepoReady CI"
          mkdir -p "$fixture/.github/workflows"
          cat > "$fixture/.github/workflows/ci.yml" <<'EOF'
          steps:
            - run: python -c "print('container smoke passed')"
          EOF
          git -C "$fixture" add .
          git -C "$fixture" commit --quiet -m "fixture"
          python -m repoready check "$fixture" --backend docker --out "$fixture/out"
          python -m unittest tests.test_docker_backend -v
